# Install as /etc/systemd/system/smart_gimbal.service.d/ros_track.conf.
# Real detection only: actuator and rangefinder remain configured mock.
[Service]
Environment=SMART_GIMBAL_DETECTOR=ros_track
Environment=ROS_DOMAIN_ID=99
Environment=ROS_LOCALHOST_ONLY=1
Environment=GIMBAL_REAL_MOTION=0
Environment=PYTHONUNBUFFERED=1
ExecStart=
ExecStart=/bin/bash -c 'source /opt/ros/humble/setup.bash && source /home/jetson/anti_drone_ws/install/setup.bash && exec python3 -u main.py'
TimeoutStopSec=10
